apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "board-games.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "board-games.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "board-games.fullname" . }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.syncOnStart }}
      # Best-effort catalog sync on every (re)start, before the app serves.
      # Non-blocking: if the sync fails (e.g. Obsidian unreachable) the app
      # still starts on the last-good volume data. The cron/trigger Workflow
      # keeps it fresh afterwards.
      initContainers:
        - name: sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "bun run src/worker/index.ts || true"]
          env:
            - name: SYNC_ONCE
              value: "1"
            {{- include "board-games.workerEnv" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.assetsGcsBucket }}
            - name: gcs-creds
              mountPath: /var/secrets/gcp
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      {{- end }}
      containers:
        {{- if not .Values.worker.workflow.enabled }}
        # Worker: polls the Obsidian Local REST API, writes catalog + users +
        # covers into the shared volume. The app never talks to Obsidian.
        # (Disabled when worker.workflow.enabled: the sync runs as an Argo
        # Workflow triggered after obsidian vault-sync instead.)
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["bun", "run", "src/worker/index.ts"]
          env:
            {{- include "board-games.workerEnv" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.assetsGcsBucket }}
            - name: gcs-creds
              mountPath: /var/secrets/gcp
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
        {{- end }}
        # The public catalog app. Reads the volume; also writes the /assets
        # variant cache, so the mount is writable.
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
            - name: BASE_URL
              value: {{ .Values.baseUrl | quote }}
            - name: WHATSAPP_NUMBER
              value: {{ .Values.whatsappNumber | quote }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: AUTH_SECRET
            # Shared bearer token for rulebook ingest + agent reads (Hermes).
            - name: ASSET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: ASSET_TOKEN
                  optional: true
            {{- if .Values.assetsGcsBucket }}
            - name: ASSETS_GCS_BUCKET
              value: {{ .Values.assetsGcsBucket | quote }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/gcp/key.json
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.assetsGcsBucket }}
            - name: gcs-creds
              mountPath: /var/secrets/gcp
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
        {{- if .Values.admin.enabled }}
        # bg-admin: the isolated cover-studio control plane. Same image, different
        # entrypoint. Shares the app's volume IN-POD (guaranteed same filesystem,
        # so a promoted pick is visible to the app immediately — and RWO-safe on
        # longhorn). Reached only via the internal `bg-admin` Service; NO Ingress.
        - name: admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bun", "run", "src/admin/index.ts"]
          ports:
            - name: admin
              containerPort: {{ .Values.admin.port }}
          env:
            - name: DATA_DIR
              value: /data
            - name: ADMIN_PORT
              value: {{ .Values.admin.port | quote }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: AUTH_SECRET
            {{- if .Values.assetsGcsBucket }}
            - name: ASSETS_GCS_BUCKET
              value: {{ .Values.assetsGcsBucket | quote }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/gcp/key.json
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.assetsGcsBucket }}
            - name: gcs-creds
              mountPath: /var/secrets/gcp
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "board-games.fullname" . }}-data
        {{- if .Values.assetsGcsBucket }}
        - name: gcs-creds
          secret:
            secretName: {{ .Values.gcsSecretName }}
            items:
              - key: private_key
                path: key.json
        {{- end }}
