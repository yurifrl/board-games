version: "3"

tasks:
  envs:op:
    desc: Resolve .env.op via 1Password CLI into .env
    generates:
      - .env
    cmds:
      - op inject -f --account my.1password.com -i .env.op -o .env

  sync:
    desc: "Worker one-shot: sync catalog + users + covers from Obsidian into the volume"
    deps: [envs:op]
    dotenv: ['.env']
    cmds:
      - SYNC_ONCE=1 bun run src/worker/index.ts

  resync-covers:
    desc: "One-shot sync that force re-pulls every cover from source (fixes stale/wrong art)"
    deps: [envs:op]
    dotenv: ['.env']
    cmds:
      - SYNC_ONCE=1 RESYNC_COVERS=1 bun run src/worker/index.ts

  worker:
    desc: "Worker sidecar: poll Obsidian and keep the volume in sync"
    deps: [envs:op]
    dotenv: ['.env']
    cmds:
      - bun run src/worker/index.ts

  gen-box-art:
    desc: "Generate flat-vector box art (front+spine) and upload to the assets bucket. Usage: task gen-box-art -- --name Clank | <game-id ...> | --all"
    deps: [envs:op]
    dotenv: ['.env']
    env:
      # GCS upload needs the ASSETS service account (not the gcal one .env points at)
      # and the bucket name, which lives only in the chart otherwise.
      GOOGLE_APPLICATION_CREDENTIALS: '{{.ROOT_DIR}}/.secrets/gcs-key.json'
      ASSETS_GCS_BUCKET: syscd-board-games-assets-d2a20e60-741d-43d4-a9b1-b2c4529e255d
    cmds:
      - bun run src/worker/gen-box-art.ts {{.CLI_ARGS}}
